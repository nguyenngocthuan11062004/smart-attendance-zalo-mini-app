<title>Ôn tập thuật toán điểm danh — Zimo Checkin</title>
<style>
  :root {
    --hust: #be1d2c;
    --hust-soft: #e8b4b9;
    --bg: #f6f4f2;
    --surface: #ffffff;
    --surface-2: #efeceb;
    --ink: #201c1c;
    --ink-2: #6c6360;
    --ink-3: #9a908c;
    --line: rgba(30,20,20,0.10);
    --good: #1f9d55;
    --good-bg: #e6f5ec;
    --warn: #c47d13;
    --warn-bg: #fbf0dc;
    --bad: #d13c3c;
    --bad-bg: #fbe6e6;
    --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --radius: 16px;
    --shadow: 0 1px 3px rgba(30,20,20,0.06), 0 8px 28px rgba(30,20,20,0.05);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --hust: #f26d78;
      --hust-soft: #6a2027;
      --bg: #17130f;
      --surface: #221c19;
      --surface-2: #2c2420;
      --ink: #f3ece8;
      --ink-2: #b6a9a2;
      --ink-3: #86776f;
      --line: rgba(255,240,235,0.10);
      --good: #55c98a; --good-bg: #16281d;
      --warn: #e0a445; --warn-bg: #2c2213;
      --bad: #f0787f; --bad-bg: #2e1616;
      --shadow: 0 1px 3px rgba(0,0,0,0.4), 0 8px 28px rgba(0,0,0,0.35);
    }
  }
  :root[data-theme="dark"] {
    --hust: #f26d78; --hust-soft: #6a2027;
    --bg: #17130f; --surface: #221c19; --surface-2: #2c2420;
    --ink: #f3ece8; --ink-2: #b6a9a2; --ink-3: #86776f;
    --line: rgba(255,240,235,0.10);
    --good: #55c98a; --good-bg: #16281d;
    --warn: #e0a445; --warn-bg: #2c2213;
    --bad: #f0787f; --bad-bg: #2e1616;
    --shadow: 0 1px 3px rgba(0,0,0,0.4), 0 8px 28px rgba(0,0,0,0.35);
  }
  :root[data-theme="light"] {
    --hust: #be1d2c; --hust-soft: #e8b4b9;
    --bg: #f6f4f2; --surface: #ffffff; --surface-2: #efeceb;
    --ink: #201c1c; --ink-2: #6c6360; --ink-3: #9a908c;
    --line: rgba(30,20,20,0.10);
    --good: #1f9d55; --good-bg: #e6f5ec;
    --warn: #c47d13; --warn-bg: #fbf0dc;
    --bad: #d13c3c; --bad-bg: #fbe6e6;
    --shadow: 0 1px 3px rgba(30,20,20,0.06), 0 8px 28px rgba(30,20,20,0.05);
  }

  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: var(--sans); line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 760px; margin: 0 auto; padding: 0 16px 80px; }

  /* Header */
  header {
    background: var(--hust); color: #fff;
    border-radius: 0 0 22px 22px; padding: 22px 20px 20px;
    margin: 0 -16px 18px;
  }
  .eyebrow {
    font-size: 12px; letter-spacing: .14em; text-transform: uppercase;
    font-weight: 700; opacity: .82; margin: 0 0 6px;
  }
  header h1 {
    margin: 0; font-size: clamp(21px, 5.2vw, 28px); font-weight: 800;
    letter-spacing: -.01em; text-wrap: balance;
  }
  header p { margin: 8px 0 0; font-size: 14px; opacity: .9; max-width: 46ch; }

  /* Toolbar */
  .toolbar {
    display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
    justify-content: space-between; margin-bottom: 14px;
  }
  .modes { display: inline-flex; background: var(--surface-2); border-radius: 999px; padding: 3px; gap: 2px; }
  .modes button {
    border: 0; background: transparent; color: var(--ink-2);
    font: inherit; font-size: 13px; font-weight: 600; cursor: pointer;
    padding: 7px 14px; border-radius: 999px;
  }
  .modes button.on { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
  .theme-btn {
    border: 1px solid var(--line); background: var(--surface); color: var(--ink-2);
    width: 38px; height: 38px; border-radius: 12px; cursor: pointer; font-size: 16px;
  }

  /* Category chips */
  .chips { display: flex; gap: 8px; overflow-x: auto; padding: 2px 0 10px; margin-bottom: 6px; -webkit-overflow-scrolling: touch; }
  .chips::-webkit-scrollbar { height: 0; }
  .chip {
    flex: 0 0 auto; border: 1px solid var(--line); background: var(--surface);
    color: var(--ink-2); font: inherit; font-size: 13px; font-weight: 600;
    padding: 7px 13px; border-radius: 999px; cursor: pointer; white-space: nowrap;
  }
  .chip.on { background: var(--hust); border-color: var(--hust); color: #fff; }

  /* Progress */
  .status { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; font-size: 13px; color: var(--ink-2); }
  .bar { flex: 1; height: 8px; background: var(--surface-2); border-radius: 999px; overflow: hidden; }
  .bar > i { display: block; height: 100%; width: 100%; background: var(--hust); border-radius: 999px; transform: scaleX(0); transform-origin: left; transition: transform .35s ease; }
  .score b { color: var(--ink); font-variant-numeric: tabular-nums; }

  /* Card */
  .card {
    background: var(--surface); border: 1px solid var(--line);
    border-radius: var(--radius); box-shadow: var(--shadow);
    padding: 20px; margin-bottom: 16px;
  }
  .qmeta { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
  .qcat {
    font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase;
    color: var(--hust); background: var(--hust-soft); padding: 3px 9px; border-radius: 999px;
  }
  :root[data-theme="dark"] .qcat, .qnum { color: var(--hust); }
  .qnum { margin-left: auto; font-size: 12px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
  .qtext { font-size: 17px; font-weight: 650; letter-spacing: -.005em; margin: 0 0 16px; text-wrap: pretty; }
  .qtext code, .explain code, .opt code {
    font-family: var(--mono); font-size: .88em; background: var(--surface-2);
    padding: 1px 5px; border-radius: 5px; word-break: break-word;
  }

  .opts { display: flex; flex-direction: column; gap: 9px; }
  .opt {
    display: flex; gap: 11px; align-items: flex-start; text-align: left;
    border: 1.5px solid var(--line); background: var(--surface);
    border-radius: 12px; padding: 12px 14px; cursor: pointer;
    font: inherit; font-size: 15px; color: var(--ink); transition: border-color .15s, background .15s;
  }
  .opt:hover:not(:disabled) { border-color: var(--hust); }
  .opt:disabled { cursor: default; }
  .opt .key {
    flex: 0 0 auto; width: 24px; height: 24px; border-radius: 7px;
    background: var(--surface-2); color: var(--ink-2);
    display: grid; place-items: center; font-size: 13px; font-weight: 700;
  }
  .opt.correct { border-color: var(--good); background: var(--good-bg); }
  .opt.correct .key { background: var(--good); color: #fff; }
  .opt.wrong { border-color: var(--bad); background: var(--bad-bg); }
  .opt.wrong .key { background: var(--bad); color: #fff; }
  .opt:focus-visible { outline: 3px solid var(--hust); outline-offset: 2px; }

  .explain {
    margin-top: 14px; border: 1px solid var(--line);
    background: var(--surface-2); border-radius: 12px;
    padding: 13px 15px; font-size: 14.5px; color: var(--ink-2);
    display: none;
  }
  .explain.show { display: block; }
  .explain::before {
    content: "Giải thích"; display: block;
    font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase;
    color: var(--ink-3); margin-bottom: 6px;
  }
  .explain b { color: var(--ink); }
  .explain .tag { font-weight: 700; }
  .explain .tag.ok { color: var(--good); }
  .explain .tag.no { color: var(--bad); }

  .nav { display: flex; gap: 10px; margin-top: 4px; }
  .btn {
    flex: 1; border: 0; border-radius: 12px; padding: 13px; font: inherit;
    font-size: 15px; font-weight: 700; cursor: pointer;
  }
  .btn.primary { background: var(--hust); color: #fff; }
  .btn.primary:disabled { opacity: .4; cursor: default; }
  .btn.ghost { background: var(--surface); color: var(--ink-2); border: 1px solid var(--line); flex: 0 0 auto; padding: 13px 18px; }

  /* Summary */
  .summary { text-align: center; }
  .summary .big { font-size: 54px; font-weight: 800; color: var(--hust); font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
  .summary .sub { color: var(--ink-2); margin: 2px 0 20px; }
  .bd { display: grid; gap: 8px; text-align: left; margin: 0 0 20px; }
  .bd .row { display: flex; align-items: center; gap: 10px; font-size: 14px; }
  .bd .row .nm { flex: 1; color: var(--ink-2); }
  .bd .row .mini { width: 90px; height: 6px; background: var(--surface-2); border-radius: 999px; overflow: hidden; }
  .bd .row .mini > i { display: block; height: 100%; background: var(--good); }
  .bd .row .val { width: 44px; text-align: right; font-variant-numeric: tabular-nums; font-weight: 700; }

  footer { text-align: center; color: var(--ink-3); font-size: 12px; padding: 8px 0 0; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="wrap">
  <header>
    <p class="eyebrow">Đồ án tốt nghiệp · Ôn tập bảo vệ</p>
    <h1>Thuật toán điểm danh — Zimo Checkin</h1>
    <p>Luyện logic 4 bước: QR giảng viên → khuôn mặt → QR ngang hàng. Mỗi câu có giải thích để bạn trả lời hội đồng.</p>
  </header>

  <div class="toolbar">
    <div class="modes">
      <button id="mQuiz" class="on" onclick="setMode('quiz')">Kiểm tra</button>
      <button id="mStudy" onclick="setMode('study')">Ôn tập</button>
    </div>
    <button class="theme-btn" onclick="toggleTheme()" title="Đổi giao diện sáng/tối" aria-label="Đổi giao diện">◐</button>
  </div>

  <div class="chips" id="chips"></div>

  <div class="status">
    <div class="bar"><i id="barFill"></i></div>
    <div class="score">Câu <b id="pos">1</b>/<b id="total">0</b> · Đúng <b id="right">0</b></div>
  </div>

  <div id="stage"></div>

  <footer>Nội dung bám sát mã nguồn thật: <code>validation.ts · crypto.ts · types/index.ts · fraud.service.ts</code></footer>
</div>

<script>
/* ------------------------------------------------------------------ *
 * Ngân hàng câu hỏi — bám sát thuật toán thật của app.
 * answer = chỉ số đáp án đúng (0-based).
 * ------------------------------------------------------------------ */
const CATS = {
  flow:  "Luồng 4 bước",
  qr:    "QR & HMAC",
  time:  "Xoay mã & hết hạn",
  face:  "Khuôn mặt",
  peer:  "Ngang hàng",
  trust: "Điểm tin cậy",
  fraud: "Chống gian lận",
  why:   "Câu hỏi hội đồng",
};

const Q = [
  // ---------------- Luồng 4 bước ----------------
  { c:"flow", q:"Luồng điểm danh của sinh viên gồm mấy bước và theo thứ tự nào?", o:[
    "3 bước: khuôn mặt → QR giảng viên → xong",
    "4 bước: quét QR giảng viên → xác minh khuôn mặt → xác minh ngang hàng → hoàn tất",
    "4 bước: khuôn mặt → GPS → QR → xong",
    "2 bước: QR giảng viên → khuôn mặt"], a:1,
    e:"Đúng 4 bước: (1) quét QR xoay của giảng viên, (2) xác minh khuôn mặt, (3) trao đổi QR ngang hàng với bạn cùng lớp, (4) màn hoàn tất kèm điểm tin cậy." },

  { c:"flow", q:"Ở bước 3 (ngang hàng), màn hình bố trí thế nào?", o:[
    "Chỉ có camera quét",
    "QR của mình bên trái + camera tự quét bạn bên phải",
    "Chỉ hiển thị QR của mình",
    "Nhập mã số của bạn bằng tay"], a:1,
    e:"Bước peer chia đôi: bên trái là QR của chính mình cho bạn quét, bên phải là camera tự quét QR của bạn khác — trao đổi hai chiều." },

  { c:"flow", q:"Bước xác minh khuôn mặt hiện tại kích hoạt bằng cách nào?", o:[
    "Tự động quét liên tục",
    "Người dùng bấm chụp rồi hệ thống so khớp",
    "Quét vân tay",
    "Chỉ cần nhìn vào camera 5 giây"], a:1,
    e:"Đã đổi từ auto-loop sang bấm-chụp: người dùng chủ động chụp, app trích vector khuôn mặt và so khớp — nhẹ máy, rõ ràng hơn." },

  { c:"flow", q:"Mục tiêu tổng thể của cả 4 bước là gì?", o:[
    "Chỉ để đếm sĩ số nhanh",
    "Chống gian lận điểm danh: đúng phiên, đúng người, có mặt thật cùng lớp",
    "Thay thế hoàn toàn giảng viên",
    "Ghi hình lớp học"], a:1,
    e:"QR chứng minh đúng phiên/đúng giảng viên; khuôn mặt chứng minh đúng người; ngang hàng chứng minh có mặt vật lý cùng các bạn." },

  { c:"flow", q:"Ba yếu tố chống gian lận tương ứng với ba câu hỏi nào?", o:[
    "Khi nào / ở đâu / bao lâu",
    "Đúng phiên? / đúng người? / có mặt thật?",
    "Ai chấm? / ai duyệt? / ai xem?",
    "Wifi? / 4G? / offline?"], a:1,
    e:"QR HMAC = đúng phiên & đúng giảng viên; khuôn mặt = đúng người; ngang hàng = có mặt vật lý (không điểm danh hộ từ xa)." },

  { c:"flow", q:"Sau khi hoàn tất, sinh viên thấy gì ở bước 4?", o:[
    "Danh sách toàn lớp",
    "Màn hoàn tất kèm trạng thái/điểm tin cậy của mình",
    "Hóa đơn",
    "Bảng xếp hạng"], a:1,
    e:"Bước 4 là màn hoàn tất, hiển thị kết quả điểm danh (điểm tin cậy: có mặt / cần xem xét / vắng)." },

  { c:"flow", q:"Ai là người khởi tạo 'phiên điểm danh' để sinh viên bắt đầu quét?", o:[
    "Sinh viên bất kỳ",
    "Giảng viên mở phiên cho lớp",
    "Hệ thống tự mở theo lịch",
    "Phòng đào tạo"], a:1,
    e:"Giảng viên mở phiên (session) cho lớp; QR xoay của giảng viên gắn với phiên đó, sinh viên quét để check-in." },

  { c:"flow", q:"Các bước khuôn mặt và ngang hàng có thể bật/tắt cho từng lớp không?", o:[
    "Không, luôn bắt buộc",
    "Có — qua cờ faceRequired và peerRequired",
    "Chỉ tắt được khuôn mặt",
    "Chỉ admin trung ương đổi được"], a:1,
    e:"Mỗi lớp/phiên có cờ faceRequired và peerRequired; giảng viên có thể cho một bước thành tùy chọn. Trust score tính theo cấu hình này." },

  { c:"flow", q:"Vì sao QR của giảng viên phải quét trước tiên?", o:[
    "Để đẹp giao diện",
    "Để lấy đúng phiên (sessionId) và bí mật phiên dùng cho các bước sau",
    "Để tải ảnh nền",
    "Không có lý do kỹ thuật"], a:1,
    e:"QR giảng viên xác định sinh viên đang ở đúng phiên nào; sessionId và bí mật phiên là gốc để ký/kiểm QR ngang hàng sau đó." },

  { c:"flow", q:"Nếu một lớp đặt peerRequired = false thì bước 3 ra sao?", o:[
    "Vẫn bắt buộc quét 1 bạn",
    "Không bắt buộc — thiếu peer vẫn có thể 'present' nếu các điều kiện khác đạt",
    "App báo lỗi",
    "Chuyển sang quét vân tay"], a:1,
    e:"peerReq = (peerRequired !== false). Nếu false thì peerPass luôn true, không cần quét bạn nào." },

  { c:"flow", q:"Dữ liệu điểm danh của mỗi sinh viên trong 1 phiên lưu ở đâu?", o:[
    "Chỉ trên máy",
    "Bản ghi attendance trên Firestore (peerVerifications, peerCount, faceVerification, trustScore...)",
    "Trong ảnh QR",
    "Gửi email"], a:1,
    e:"Mỗi sinh viên có 1 attendance doc chứa peerVerifications[], peerCount, faceVerification, trustScore, teacherOverride..." },

  { c:"flow", q:"Giảng viên có thể can thiệp kết quả điểm danh của sinh viên không?", o:[
    "Không bao giờ",
    "Có — teacherOverride ('present'/'absent') được ưu tiên tuyệt đối",
    "Chỉ sửa được tên",
    "Chỉ xóa cả phiên"], a:1,
    e:"effectiveTrustScore ưu tiên teacherOverride trên hết: giảng viên điểm danh thủ công/ghi đè khi cần." },

  // ---------------- QR & HMAC ----------------
  { c:"qr", q:"Chữ ký của mỗi mã QR được tạo bằng thuật toán nào?", o:[
    "MD5", "HMAC-SHA256 với bí mật của phiên", "Base64", "SHA-1 không khóa"], a:1,
    e:"signPayload dùng CryptoJS.HmacSHA256(message, secret) — có khóa bí mật phiên nên không giả được nếu không biết secret." },

  { c:"qr", q:"Chuỗi thông điệp được ký có định dạng nào?", o:[
    "Chỉ userId",
    "`type:sessionId:userId:timestamp:nonce`",
    "JSON toàn bộ payload",
    "sessionId + ngày"], a:1,
    e:"message = `${type}:${sessionId}:${userId}:${timestamp}:${nonce}` rồi mới HMAC. Đổi bất kỳ trường nào → chữ ký đổi." },

  { c:"qr", q:"'nonce' trong payload dùng để làm gì?", o:[
    "Số thứ tự lớp",
    "Giá trị ngẫu nhiên 16 byte làm mỗi QR khác nhau, chống trùng/đoán",
    "Tên giảng viên",
    "Mã tỉnh thành"], a:1,
    e:"generateNonce() = WordArray.random(16). Nonce ngẫu nhiên khiến hai QR cùng thời điểm vẫn khác nhau và khó dựng lại." },

  { c:"qr", q:"verifySignature kiểm tra hợp lệ bằng cách nào?", o:[
    "Giải mã ngược chữ ký",
    "Tự ký lại message rồi so sánh chuỗi bằng `===` với chữ ký nhận được",
    "Hỏi server",
    "So độ dài chuỗi"], a:1,
    e:"expected = signPayload(data, secret); trả về expected === signature. Không cần server — kiểm ngay trên máy." },

  { c:"qr", q:"Payload QR có mấy trường bắt buộc để parseQRContent chấp nhận?", o:[
    "3", "6: type, sessionId, userId, timestamp, nonce, signature", "2", "10"], a:1,
    e:"parseQRContent yêu cầu đủ 6 trường đúng kiểu (type/sessionId/userId string, timestamp number, nonce/signature string), thiếu/sai kiểu → trả null." },

  { c:"qr", q:"Có mấy loại QR trong hệ thống (trường type)?", o:[
    "1 loại", "2 loại: 'teacher' và 'peer'", "3 loại", "Không phân loại"], a:1,
    e:"type ∈ {teacher, peer}. QR giảng viên dùng cho bước 1; QR sinh viên dùng cho bước ngang hàng." },

  { c:"qr", q:"validateTeacherQR trả 'QR không phải của giảng viên' khi nào?", o:[
    "Khi hết hạn",
    "Khi payload.type !== 'teacher'",
    "Khi thiếu GPS",
    "Khi peerCount = 0"], a:1,
    e:"Điều kiện đầu tiên: type phải là 'teacher', không thì chặn ngay trước cả khi kiểm chữ ký." },

  { c:"qr", q:"Nếu sinh viên tự dựng QR giả nhưng không biết bí mật phiên thì sao?", o:[
    "Vẫn hợp lệ",
    "Chữ ký sai → verifySignature false → 'Chữ ký không hợp lệ'",
    "App tự sửa chữ ký",
    "Được chấp nhận nếu đúng sessionId"], a:1,
    e:"Không có secret thì không tạo được HMAC đúng; chữ ký so sánh lệch → bị chặn. Đây là lõi chống giả mạo." },

/* ------------------------------------------------------------------ */
let mode = "quiz";          // quiz | study
let filter = "all";
let list = [];              // filtered questions
let idx = 0;
let answered = [];          // per-question chosen index (or -1)
const results = {};         // cat -> {right,total}

function buildList() {
  list = Q.map((q, i) => ({ ...q, _id: i })).filter(q => filter === "all" || q.c === filter);
  idx = 0;
  answered = list.map(() => -1);
}

function setMode(m) {
  mode = m;
  document.getElementById("mQuiz").classList.toggle("on", m === "quiz");
  document.getElementById("mStudy").classList.toggle("on", m === "study");
  buildList(); render();
}

function setFilter(f) {
  filter = f;
  document.querySelectorAll(".chip").forEach(c => c.classList.toggle("on", c.dataset.f === f));
  buildList(); render();
}

function toggleTheme() {
  const cur = document.documentElement.getAttribute("data-theme");
  const next = cur === "dark" ? "light" : cur === "light" ? "dark"
    : (matchMedia("(prefers-color-scheme: dark)").matches ? "light" : "dark");
  document.documentElement.setAttribute("data-theme", next);
}

function renderChips() {
  const box = document.getElementById("chips");
  const entries = [["all", "Tất cả"], ...Object.entries(CATS)];
  box.innerHTML = entries.map(([k, v]) =>
    `<button class="chip ${k === 'all' ? 'on' : ''}" data-f="${k}" onclick="setFilter('${k}')">${v}${k !== 'all' ? ` <span style="opacity:.6">${Q.filter(q => q.c === k).length}</span>` : ''}</button>`
  ).join("");
}

function stats() {
  let right = 0, done = 0;
  answered.forEach((a, i) => { if (a !== -1) { done++; if (a === list[i].a) right++; } });
  return { right, done };
}

function updateStatus() {
  const { right } = stats();
  document.getElementById("pos").textContent = Math.min(idx + 1, list.length);
  document.getElementById("total").textContent = list.length;
  document.getElementById("right").textContent = right;
  document.getElementById("barFill").style.transform = "scaleX(" + (list.length ? idx / list.length : 0) + ")";
}

function esc(s) { return s.replace(/&/g, "&amp;").replace(/</g, "&lt;"); }
// cho phép <code> đã có sẵn trong nội dung: ta soạn thủ công nên render trực tiếp
function md(s) { return s; }

function render() {
  const stage = document.getElementById("stage");
  if (idx >= list.length) { renderSummary(); updateStatus(); return; }
  const q = list[idx];
  const chosen = answered[idx];
  const reveal = mode === "study" || chosen !== -1;

  const opts = q.o.map((opt, i) => {
    let cls = "opt";
    if (reveal) {
      if (i === q.a) cls += " correct";
      else if (i === chosen) cls += " wrong";
    }
    const key = String.fromCharCode(65 + i);
    return `<button class="${cls}" ${reveal ? "disabled" : ""} onclick="choose(${i})">
      <span class="key">${reveal && i === q.a ? "✓" : reveal && i === chosen ? "✕" : key}</span>
      <span>${md(opt)}</span></button>`;
  }).join("");

  const verdict = (mode === "quiz" && chosen !== -1)
    ? (chosen === q.a
        ? `<span class="tag ok">✓ Chính xác. </span>`
        : `<span class="tag no">✕ Chưa đúng. </span>`)
    : "";

  stage.innerHTML = `
    <div class="card">
      <div class="qmeta">
        <span class="qcat">${CATS[q.c]}</span>
        <span class="qnum">#${idx + 1} / ${list.length}</span>
      </div>
      <p class="qtext">${md(q.q)}</p>
      <div class="opts">${opts}</div>
      <div class="explain ${reveal ? "show" : ""}">${verdict}${md(q.e)}</div>
    </div>
    <div class="nav">
      <button class="btn ghost" onclick="prev()" ${idx === 0 ? "disabled" : ""}>←</button>
      <button class="btn primary" id="nextBtn" onclick="next()" ${(mode === "quiz" && chosen === -1) ? "disabled" : ""}>
        ${idx === list.length - 1 ? "Xem kết quả" : "Câu tiếp →"}
      </button>
    </div>`;
  updateStatus();
}

function choose(i) {
  if (mode === "quiz" && answered[idx] !== -1) return;
  answered[idx] = i;
  render();
}

function next() {
  if (mode === "quiz" && answered[idx] === -1 && idx < list.length) return;
  idx++;
  render();
}
function prev() { if (idx > 0) { idx--; render(); } }

function renderSummary() {
  // tổng hợp theo category
  const per = {};
  list.forEach((q, i) => {
    per[q.c] = per[q.c] || { right: 0, total: 0 };
    per[q.c].total++;
    if (answered[i] === q.a) per[q.c].right++;
  });
  const { right, done } = stats();
  const pct = list.length ? Math.round(right / list.length * 100) : 0;
  const rows = Object.entries(per).map(([c, v]) => {
    const p = Math.round(v.right / v.total * 100);
    return `<div class="row">
      <span class="nm">${CATS[c]}</span>
      <span class="mini"><i style="width:${p}%;background:${p >= 70 ? 'var(--good)' : p >= 40 ? 'var(--warn)' : 'var(--bad)'}"></i></span>
      <span class="val">${v.right}/${v.total}</span></div>`;
  }).join("");

  const msg = pct >= 85 ? "Sẵn sàng bảo vệ! 💪" : pct >= 60 ? "Khá ổn — ôn thêm phần điểm yếu." : "Cần ôn lại kỹ hơn.";
  document.getElementById("stage").innerHTML = `
    <div class="card summary">
      <div class="big">${pct}%</div>
      <div class="sub">Đúng ${right}/${list.length} câu · ${msg}</div>
      <div class="bd">${rows}</div>
      <div class="nav">
        <button class="btn ghost" onclick="reviewWrong()">Xem câu sai</button>
        <button class="btn primary" onclick="restart()">Làm lại</button>
      </div>
    </div>`;
}

function restart() { buildList(); render(); }

function reviewWrong() {
  // lọc còn các câu đã trả lời sai; nếu không có, giữ nguyên
  const wrongIds = list.filter((q, i) => answered[i] !== -1 && answered[i] !== q.a).map(q => q._id);
  if (!wrongIds.length) { alert("Không có câu nào sai. Tuyệt vời!"); return; }
  list = Q.map((q, i) => ({ ...q, _id: i })).filter(q => wrongIds.includes(q._id));
  answered = list.map(() => -1);
  idx = 0; mode = "study";
  document.getElementById("mStudy").classList.add("on");
  document.getElementById("mQuiz").classList.remove("on");
  render();
}

/* init */
renderChips();
buildList();
render();
</script>
